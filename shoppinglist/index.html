<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex, nofollow">
        <title>Shopping List | The Cactus Club</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="../www/css/styles.css">
        <style>
            .shop { max-width: 540px; margin: 0 auto; padding: 0 16px; }
            .shop input[type="checkbox"] { accent-color: #64874c; width: 1.1em; height: 1.1em; }
            .shop label { cursor: pointer; display: flex; gap: .6em; align-items: baseline; padding: 4px 0; }
            .drink-name { font-size: 1.2rem; }
            .used-in { font-family: Calibre-italic; font-size: .9rem; }
            .ingredient.got span { text-decoration: line-through; opacity: .5; }
            .category { color: #64874c; font-family: Calibre; font-size: 1.1rem; margin-top: 1.2em; border-bottom: 1px solid #fba08f; padding-bottom: 2px; }
            .btn-link { color: #fba08f; text-decoration: none; padding: 0 .4em; }
            .btn-link:hover { color: #64874c; }
        </style>
    </head>
    <body>
        <div class="px-4 my-4 mb-0 text-center">
            <h1 class="display-4"><a href="../" style="color: black;">Cactus Club</a></h1>
        </div>
        <div class="row">
            <div class="col"></div>
            <div class="col-8"><hr class="head"></div>
            <div class="col"></div>
        </div>

        <div class="shop">
            <h2 class="text-center">Drinks</h2>
            <div class="text-center mb-2">
                <button class="btn btn-link" id="select_all">Select all</button>
                <button class="btn btn-link" id="select_none">Clear</button>
            </div>
            <div id="drink_choices"></div>
            <br>

            <h2 class="text-center">Shopping List</h2>
            <p class="text-center" id="empty_msg">Select some drinks above.</p>
            <div id="ingredient_list"></div>
            <div class="text-center my-3">
                <button class="btn btn-link d-none" id="copy_list">Copy list</button>
            </div>
            <br>
        </div>

        <script>
            // Decode HTML entities like &#241 used in drinks.json
            const decode = (s) => {
                const t = document.createElement('textarea');
                t.innerHTML = s;
                return t.value;
            };

            // Categories in display order. Each ingredient goes in the first category
            // (by `order`) whose pattern matches, so "Grapefruit Bitters" lands in
            // Bitters and "Banana Liqueur" in Liqueurs rather than Fruit.
            const CATEGORIES = [
                { name: 'Spirits',              order: 5, match: /\b(rum|gin|whiske?y|bourbon|rye|scotch|brandy|cognac|tequila|mezcal|vodka|absinthe|pisco|cacha[cç]a)\b/i },
                { name: 'Liqueurs',             order: 3, match: /liqueur|benedictine|chartreuse|cr[eè]me de|grand ma|triple sec|cura[cç]ao|cointreau|amaro|campari|aperol|st[ .-]*germain/i },
                { name: 'Wine & Bubbly',        order: 4, match: /champagne|prosecco|cava|wine|vermouth|sherry|port\b/i },
                { name: 'Bitters',              order: 1, match: /bitters/i },
                { name: 'Syrups & Sweeteners',  order: 2, match: /syrup|sugar|honey|agave|grenadine|orgeat/i },
                { name: 'Fruit & Produce',      order: 7, match: /lemon|lime|orange|grapefruit|pineapple|coconut|banana|berr|cucumber|mint|ginger|cherry|apple|passion|mango/i },
                { name: 'Dairy & Eggs',         order: 6, match: /\begg|cream\b|milk/i },
                { name: 'Other',                order: 99, match: /./ },
            ];
            const categorize = (ing) =>
                [...CATEGORIES].sort((a, b) => a.order - b.order).find(c => c.match.test(ing)).name;

            const escape = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

            fetch('../data/drinks.json')
                .then(response => response.json())
                .then(drinks => {
                    // Same "current menu" logic as the main page: classics + this season's drinks
                    const month = new Date().getMonth();
                    const season = (month >= 2 && month <= 8) ? 'summer' : 'winter';
                    const menu = drinks.filter(d => d.season === 'classic' || d.season === season);

                    const choices = document.getElementById('drink_choices');
                    menu.forEach(drink => {
                        const label = document.createElement('label');
                        label.innerHTML = `
                            <input type="checkbox" value="${drink.id}">
                            <span><span class="drink-name">${drink.name}</span><br>
                            <small>${drink.ingredients}</small></span>
                        `;
                        choices.appendChild(label);
                    });

                    const list = document.getElementById('ingredient_list');
                    const emptyMsg = document.getElementById('empty_msg');
                    const copyBtn = document.getElementById('copy_list');
                    let current = [];

                    // Group the current ingredients by category, in display order, skipping empty ones
                    const groups = () => CATEGORIES
                        .map(c => ({ name: c.name, items: current.filter(i => categorize(i.name) === c.name) }))
                        .filter(g => g.items.length);

                    const render = () => {
                        const selected = [...choices.querySelectorAll('input:checked')]
                            .map(cb => menu.find(d => d.id === cb.value));

                        // Combine ingredients, de-duplicating case-insensitively
                        const combined = new Map();
                        selected.forEach(drink => {
                            decode(drink.ingredients).split(',').map(i => i.trim()).filter(Boolean).forEach(ing => {
                                const key = ing.toLowerCase();
                                if (!combined.has(key)) combined.set(key, { name: ing, drinks: [] });
                                combined.get(key).drinks.push(drink.name);
                            });
                        });

                        current = [...combined.values()].sort((a, b) => a.name.localeCompare(b.name));
                        emptyMsg.classList.toggle('d-none', current.length > 0);
                        copyBtn.classList.toggle('d-none', current.length === 0);

                        list.innerHTML = groups().map(g => `
                            <h4 class="category">${g.name}</h4>
                            ${g.items.map(ing => `
                                <label class="ingredient">
                                    <input type="checkbox">
                                    <span>${escape(ing.name)}<br>
                                    <span class="used-in">${escape(decode(ing.drinks.join(', ')))}</span></span>
                                </label>
                            `).join('')}
                        `).join('');
                    };

                    choices.addEventListener('change', render);

                    // Tick off ingredients you already have / have bought
                    list.addEventListener('change', e => {
                        e.target.closest('.ingredient').classList.toggle('got', e.target.checked);
                    });

                    const setAll = (checked) => {
                        choices.querySelectorAll('input').forEach(cb => cb.checked = checked);
                        render();
                    };
                    document.getElementById('select_all').addEventListener('click', () => setAll(true));
                    document.getElementById('select_none').addEventListener('click', () => setAll(false));

                    copyBtn.addEventListener('click', () => {
                        const text = groups()
                            .map(g => `${g.name}\n` + g.items.map(i => `- ${i.name}`).join('\n'))
                            .join('\n\n');
                        navigator.clipboard.writeText(text).then(() => {
                            copyBtn.textContent = 'Copied!';
                            setTimeout(() => copyBtn.textContent = 'Copy list', 1500);
                        });
                    });
                });
        </script>
    </body>
</html>
